name: CI/CD — ObRail Europe

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ── Job 1 : Tests Backend ──────────────────────────────────────────────────
  test-backend:
    name: Tests Backend (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt -r requirements-test.txt
          pip install "starlette>=0.40.0,<1.0.0"

      - name: Run pytest (seuil couverture ≥ 80%)
        env:
          PYTHONDONTWRITEBYTECODE: 1
          PYTHONUNBUFFERED: 1
        run: pytest

      - name: Upload rapport couverture HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  # ── Job 2 : Tests E2E ──────────────────────────────────────────────────────
  test-e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright + Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ── Job 3 : Build Docker (conditionné par les 2 jobs de test) ─────────────
  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test-backend, test-e2e]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prépare le répertoire models (vide en CI)
        run: mkdir -p models

      - name: Build image API
        run: |
          docker build \
            -f api/Dockerfile \
            -t obrail-api:${{ github.sha }} \
            -t obrail-api:latest \
            .

      - name: Build image Frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=http://localhost:8000 \
            --build-arg VITE_GRAFANA_URL=http://localhost:3000 \
            --build-arg VITE_PROMETHEUS_URL=http://localhost:9090 \
            -f frontend/Dockerfile \
            -t obrail-frontend:${{ github.sha }} \
            -t obrail-frontend:latest \
            ./frontend
